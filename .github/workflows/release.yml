name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # build provenance attestations
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew buildAndCollect
      # A tag that doesn't match mod-version would silently release a
      # mislabeled jar — fail instead.
      - name: Tag must match mod-version
        run: ls build/libs/"${GITHUB_REF_NAME#v}"/xaerotools-companion-"${GITHUB_REF_NAME#v}"+*.jar
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/libs/**/*.jar
      - uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*/*.jar
          draft: true
          generate_release_notes: true
